<!DOCTYPE html>
<html>
<head>
    <!-- Create a testimonials slider carousel powered by JavaScript arrays and CSS opacity transitions. -->
    <style>
        .carousel { max-width: 400px; margin: 50px auto; text-align: center; font-family: Arial; background: #f9f9f9; padding: 20px; border-radius: 8px; }
        .testimonial { opacity: 0; transition: opacity 0.5s ease-in-out; display: none; }
        .testimonial.active { opacity: 1; display: block; }
        button { margin-top: 15px; padding: 8px 15px; }
    </style>
</head>
<body>
    <div class="carousel">
        <div class="testimonial active">"This product changed my business completely!" - Client A</div>
        <div class="testimonial">"Incredible support and wonderful features." - Client B</div>
        <div class="testimonial">"Highly recommended to everyone!" - Client C</div>
        <button id="nextBtn">Next Testimonial</button>
    </div>
    <script>
        const testimonials = document.querySelectorAll('.testimonial');
        let currentIndex = 0;
        document.getElementById('nextBtn').addEventListener('click', () => {
            testimonials[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % testimonials.length;
            testimonials[currentIndex].classList.add('active');
        });
    </script>
</body>
</html>
