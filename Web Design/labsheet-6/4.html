<!DOCTYPE html>
<html>
<head>
    <!-- Add interactive hamburger menu toggling for mobile screens using JavaScript event listeners and CSS class manipulation. -->
    <style>
        .navbar { display: flex; justify-content: space-between; background: #333; color: white; padding: 1rem; align-items: center; }
        .nav-links { display: flex; list-style: none; gap: 20px; }
        .nav-links a { color: white; text-decoration: none; }
        .hamburger { display: none; cursor: pointer; font-size: 1.5rem; }
        @media (max-width: 768px) {
            .nav-links { display: none; flex-direction: column; width: 100%; background: #444; position: absolute; top: 60px; left: 0; padding: 10px 0; text-align: center; }
            .nav-links.active { display: flex; }
            .hamburger { display: block; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">MyBrand</div>
        <div class="hamburger" id="hamburger">&#9776;</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
        </ul>
    </nav>
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
