<!DOCTYPE html>
<html>
<head>
    <!-- Implement a modal popup window in JavaScript that triggers upon clicking a button and closes upon clicking an 'X' or outside the modal. -->
    <style>
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 5px; position: relative; width: 300px; font-family: Arial; }
        .close { position: absolute; top: 5px; right: 10px; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>
    <button id="openModal">Open Modal</button>
    <div class="modal" id="myModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Modal Title</h2>
            <p>This is a popup modal window.</p>
        </div>
    </div>
    <script>
        const modal = document.getElementById('myModal');
        document.getElementById('openModal').onclick = () => modal.style.display = 'flex';
        document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    </script>
</body>
</html>
