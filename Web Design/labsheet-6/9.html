<!DOCTYPE html>
<html>
<head>
    <!-- Implement a smooth-scrolling navigation effect in JavaScript when clicking anchor links in the header menu. -->
    <style>
        html { scroll-behavior: smooth; }
        nav { position: fixed; top: 0; background: #333; width: 100%; padding: 15px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; }
        section { height: 100vh; padding-top: 80px; font-family: Arial; font-size: 2rem; }
    </style>
</head>
<body>
    <nav>
        <a href="#section1">Home</a>
        <a href="#section2">Services</a>
        <a href="#section3">Contact</a>
    </nav>
    <section id="section1" style="background: #f4f4f4;">Home Section</section>
    <section id="section2" style="background: #e2e2e2;">Services Section</section>
    <section id="section3" style="background: #d1d1d1;">Contact Section</section>
</body>
</html>
