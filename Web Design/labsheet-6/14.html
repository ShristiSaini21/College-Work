<!DOCTYPE html>
<html>
<head>
    <!-- Write custom CSS media queries to ensure the website is fully responsive across mobile, tablet, and desktop viewports. -->
    <style>
        .container { background: lightgreen; padding: 20px; text-align: center; font-family: Arial; font-size: 1.5rem; }
        @media (max-width: 600px) {
            .container { background: lightcoral; }
        }
        @media (min-width: 601px) and (max-width: 1024px) {
            .container { background: lightskyblue; }
        }
    </style>
</head>
<body>
    <div class="container">Resize browser window to test responsiveness!</div>
</body>
</html>
