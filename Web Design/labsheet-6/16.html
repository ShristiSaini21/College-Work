<!DOCTYPE html>
<html>
<head>
    <!-- Design a product feature grid using CSS flexbox with custom vector icons and responsive spacing. -->
    <style>
        .feature-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 20px; font-family: Arial; }
        .feature-item { flex: 1 1 250px; border: 1px solid #ddd; padding: 20px; text-align: center; border-radius: 6px; }
        .icon { font-size: 2rem; margin-bottom: 10px; color: #007bff; }
    </style>
</head>
<body>
    <div class="feature-grid">
        <div class="feature-item"><div class="icon">&#9889;</div><h3>Fast Performance</h3><p>Optimized for speed.</p></div>
        <div class="feature-item"><div class="icon">&#128737;</div><h3>Secure Data</h3><p>Protected with high standards.</p></div>
    </div>
</body>
</html>
