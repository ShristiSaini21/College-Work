<!DOCTYPE html>
<html>
<head>
    <!-- Implement a responsive hero banner section with background image overlay, typography hierarchy, and a call-to-action button. -->
    <style>
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('hero-bg.jpg') no-repeat center center/cover;
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 20px;
        }
        .hero h1 { font-size: 3rem; margin-bottom: 10px; }
        .hero p { font-size: 1.2rem; margin-bottom: 20px; }
        .cta-btn { background-color: #ff5722; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Hi, I am a Web Developer</h1>
        <p>Building beautiful and responsive digital experiences.</p>
        <a href="#projects" class="cta-btn">View My Work</a>
    </div>
</body>
</html>
