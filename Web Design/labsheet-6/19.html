<!DOCTYPE html>
<html>
<head>
    <!-- Create an interactive search filter bar in JavaScript that filters portfolio project cards dynamically as the user types. -->
    <style>
        body { font-family: Arial; padding: 20px; text-align: center; }
        input { padding: 8px; width: 250px; margin-bottom: 20px; }
        .project-list { display: flex; justify-content: center; gap: 15px; }
        .project-card { border: 1px solid #ccc; padding: 15px; border-radius: 5px; width: 150px; }
    </style>
</head>
<body>
    <input type="text" id="searchBar" placeholder="Search projects...">
    <div class="project-list" id="projectContainer">
        <div class="project-card">Web App</div>
        <div class="project-card">Mobile App</div>
        <div class="project-card">UI Design</div>
    </div>
    <script>
        const searchBar = document.getElementById('searchBar');
        const cards = document.querySelectorAll('.project-card');
        searchBar.addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            cards.forEach(card => {
                if (card.textContent.toLowerCase().includes(term)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
