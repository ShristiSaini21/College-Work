<!DOCTYPE html>
<html>
<head>
    <!-- Design a footer section containing social media icon links styled with CSS flexbox and hover color transitions. -->
    <style>
        footer { background: #222; color: white; padding: 20px; text-align: center; font-family: Arial; }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .social-icons a { color: white; text-decoration: none; transition: color 0.3s; font-size: 1.1rem; }
        .social-icons a:hover { color: #007bff; }
    </style>
</head>
<body>
    <footer>
        <p>Connect with us on social media</p>
        <div class="social-icons">
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
            <a href="#">LinkedIn</a>
            <a href="#">Instagram</a>
        </div>
    </footer>
</body>
</html>
