<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7 - Focus Pseudo-class</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #fafafa; }
        form { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; transition: all 0.3s ease; }
        input:focus, textarea:focus { border-color: #ff5722; background-color: #fff3e0; outline: none; }
    </style>
</head>
<body>
    <form>
        <h2>Feedback Form</h2>
        <div class="group"><label>Name:</label><input type="text" placeholder="Click here"></div>
        <div class="group"><label>Feedback:</label><textarea rows="4" placeholder="Click here"></textarea></div>
    </form>
</body>
</html>
