<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q6 - CSS Grid Form</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f4f4f9; }
        form { background: white; padding: 30px; max-width: 600px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { grid-column: span 2; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <form>
        <h2 style="grid-column: span 2; text-align: center;">Two-Column Grid Form</h2>
        <div><label>First Name</label><input type="text"></div>
        <div><label>Last Name</label><input type="text"></div>
        <div class="full-width"><label>Email</label><input type="email"></div>
        <div><label>City</label><input type="text"></div>
        <div><label>Postal Code</label><input type="text"></div>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
