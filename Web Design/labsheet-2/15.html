<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q15 - Expanding Search</title>
    <style>
        body { font-family: Arial; padding: 60px; background: #eef2f5; text-align: center; }
        input[type="text"] {
            width: 150px;
            padding: 10px 15px;
            border: 2px solid #ccc;
            border-radius: 20px;
            outline: none;
            transition: width 0.4s ease-in-out, border-color 0.4s;
        }
        input[type="text"]:focus {
            width: 320px;
            border-color: #007bff;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <h2>Click or Focus the Search Box</h2>
    <input type="text" placeholder="Search here...">
</body>
</html>
