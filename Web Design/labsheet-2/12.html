<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q12 - Checkout Form</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 30px; }
        .checkout-box { background: white; padding: 30px; max-width: 450px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        @media (max-width: 600px) {
            .checkout-box { padding: 15px; }
            input { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="checkout-box">
        <h2>Payment Checkout</h2>
        <form>
            <div class="group"><label>Card Number</label><input type="text" placeholder="1234 5678 9876 5432"></div>
            <div class="group"><label>Expiry Date</label><input type="text" placeholder="MM/YY"></div>
            <div class="group"><label>CVV</label><input type="password" placeholder="123"></div>
            <button type="submit">Pay Now</button>
        </form>
    </div>
</body>
</html>
