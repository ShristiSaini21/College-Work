<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q10 - Table inside Form</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f9f9f9; }
        .container { background: white; padding: 30px; max-width: 600px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:hover { background-color: #e9ecef; }
        input[type="text"] { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Data Entry Form</h2>
        <form>
            <table>
                <tr>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                </tr>
                <tr>
                    <td><input type="text" value="Notebook"></td>
                    <td><input type="text" value="2"></td>
                    <td><input type="text" value="100"></td>
                </tr>
                <tr>
                    <td><input type="text" value="Pen"></td>
                    <td><input type="text" value="5"></td>
                    <td><input type="text" value="50"></td>
                </tr>
            </table>
            <button type="submit">Save Data</button>
        </form>
    </div>
</body>
</html>
