<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2 - HTML5 Validation</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f9f9f9; }
        form { background: #fff; padding: 20px; max-width: 400px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <form>
        <h2>Validation Form</h2>
        <div class="group">
            <label>Username (min 3, max 15 chars):</label>
            <input type="text" required minlength="3" maxlength="15" placeholder="Enter username">
        </div>
        <div class="group">
            <label>Email Address:</label>
            <input type="email" required placeholder="name@example.com">
        </div>
        <div class="group">
            <label>Pincode (6 digits pattern):</label>
            <input type="text" required pattern="[0-9]{6}" placeholder="110001">
        </div>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
