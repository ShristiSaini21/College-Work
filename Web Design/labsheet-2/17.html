<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q17 - Hidden Input</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f0f0f5; }
        .box { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Secure Form Session</h2>
        <form>
            <!-- Hidden Input Field securely passing data -->
            <input type="hidden" name="session_token" value="SECURE_AUTH_TOKEN_98765">
            <div class="group"><label>Username:</label><input type="text" placeholder="Enter username"></div>
            <button type="submit">Submit with Token</button>
        </form>
    </div>
</body>
</html>
