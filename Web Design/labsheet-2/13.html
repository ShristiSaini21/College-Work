<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q13 - Custom Checkboxes</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #fff; }
        .box { background: #f9f9f9; padding: 25px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 12px; font-size: 16px; cursor: pointer; }
        input[type="checkbox"], input[type="radio"] { accent-color: #6200ee; transform: scale(1.2); margin-right: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Custom Selections</h2>
        <label><input type="checkbox"> Custom Checkbox Option 1</label>
        <label><input type="checkbox"> Custom Checkbox Option 2</label>
        <hr style="border:0; border-top:1px solid #ddd; margin:15px 0;">
        <label><input type="radio" name="r"> Custom Radio Option A</label>
        <label><input type="radio" name="r"> Custom Radio Option B</label>
    </div>
</body>
</html>
