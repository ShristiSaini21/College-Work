<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q18 - Flexbox Contact Layout</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #eef2f5; }
        .container { display: flex; gap: 20px; max-width: 700px; margin: auto; }
        .card { background: white; padding: 25px; flex: 1; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3>Contact Us Form</h3>
            <input type="text" placeholder="Your Name">
            <textarea rows="3" placeholder="Message"></textarea>
            <button>Send</button>
        </div>
        <div class="card">
            <h3>Company Location</h3>
            <p><strong>COER University</strong><br>Roorkee, Uttarakhand<br>India</p>
        </div>
    </div>
</body>
</html>
