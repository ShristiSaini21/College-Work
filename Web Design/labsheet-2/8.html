<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q8 - File Upload & Transitions</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f0f0f5; }
        form { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"] { border: 1px solid #ccc; padding: 8px; width: 100%; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #6200ee; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background-color 0.3s, transform 0.1s; }
        button:hover { background-color: #3700b3; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <form>
        <h2>Upload Document</h2>
        <div class="group">
            <label>Select File:</label>
            <input type="file">
        </div>
        <button type="submit">Upload File</button>
    </form>
</body>
</html>
