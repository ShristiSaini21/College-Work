<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q16 - Float Alignment Form</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f9f9f9; }
        .box { background: white; padding: 30px; max-width: 450px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .row { margin-bottom: 15px; overflow: hidden; }
        label { float: left; width: 35%; font-weight: bold; padding-top: 6px; }
        input, select { float: right; width: 60%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Employee Evaluation</h2>
        <form>
            <div class="row"><label>Emp Name:</label><input type="text"></div>
            <div class="row"><label>Department:</label><input type="text"></div>
            <div class="row">
                <label>Rating:</label>
                <select><option>Excellent</option><option>Good</option><option>Average</option></select>
            </div>
            <button type="submit">Submit Evaluation</button>
        </form>
    </div>
</body>
</html>
