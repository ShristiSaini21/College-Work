<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q14 - Exception Handling</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f4f4f9; }
        .box { background: white; padding: 30px; max-width: 450px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; padding: 8px; box-sizing: border-box; font-family: monospace; }
        button { width: 100%; padding: 10px; background: #6200ee; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #output { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>JSON Parser with Try-Catch-Finally</h2>
        <textarea id="jsonInput" placeholder='Enter JSON string, e.g., {"name": "Aman"}'></textarea>
        <button onclick="parseJSONString()">Parse JSON</button>
        <div id="output"></div>
    </div>

    <script>
        function parseJSONString() {
            let inputStr = document.getElementById("jsonInput").value;
            let output = document.getElementById("output");

            try {
                let parsedObj = JSON.parse(inputStr);
                output.style.color = "green";
                output.innerHTML = `Successfully Parsed! Name property: ${parsedObj.name || 'N/A'}`;
            } catch (error) {
                output.style.color = "red";
                output.innerHTML = `Error Caught: ${error.message}`;
            } finally {
                console.log("Execution of try-catch block completed.");
            }
        }
    </script>
</body>
</html>
