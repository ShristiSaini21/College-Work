<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q17 - Vowel Counter</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f9f9f9; }
        .box { background: white; padding: 30px; max-width: 450px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 90px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #output { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Vowel Counter</h2>
        <textarea id="paraInput" placeholder="Enter a paragraph or sentence..."></textarea>
        <button onclick="countVowels()">Count Vowels</button>
        <div id="output"></div>
    </div>

    <script>
        function countVowels() {
            let text = document.getElementById("paraInput").value;
            let matches = text.match(/[aeiouAEIOU]/g);
            let count = matches ? matches.length : 0;
            
            document.getElementById("output").innerHTML = `Total Vowel Count: <span style="color: #007bff;">${count}</span>`;
        }
    </script>
</body>
</html>
