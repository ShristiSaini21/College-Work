<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - Dynamic DOM</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f4f4f9; }
        .box { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #6200ee; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #listContainer { margin-top: 15px; padding-left: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Dynamic Element Creator</h2>
        <input type="text" id="itemInput" placeholder="Enter list item text">
        <button id="addBtn">Add Element</button>
        <ul id="listContainer"></ul>
    </div>

    <script>
        document.getElementById("addBtn").addEventListener("click", function() {
            let text = document.getElementById("itemInput").value.trim();
            if (text === "") {
                alert("Please enter some text!");
                return;
            }

            // Using createElement and appendChild
            let li = document.createElement("li");
            li.appendChild(document.createTextNode(text));
            document.getElementById("listContainer").appendChild(li);

            document.getElementById("itemInput").value = "";
        });
    </script>
</body>
</html>
