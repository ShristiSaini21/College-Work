<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q16 - Image Gallery Slider</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f4f4f9; text-align: center; }
        .box { background: white; padding: 25px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        img { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; border: 1px solid #ddd; }
        button { padding: 10px 20px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 0 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Image Gallery Slider</h2>
        <img id="slideImg" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Slider Image">
        <div>
            <button onclick="prevImage()">Previous</button>
            <button onclick="nextImage()">Next</button>
        </div>
    </div>

    <script>
        const images = [
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05",
            "https://images.unsplash.com/photo-1426604966848-d7adac902bff",
            "https://images.unsplash.com/photo-1511884642898-4c92249e20b6"
        ];
        let currentIndex = 0;
        const imgElement = document.getElementById("slideImg");

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            imgElement.src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            imgElement.src = images[currentIndex];
        }
    </script>
</body>
</html>
