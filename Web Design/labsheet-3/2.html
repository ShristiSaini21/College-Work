<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2 - Prime or Composite</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f9f9f9; }
        .box { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #output { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Prime / Composite Checker</h2>
        <input type="number" id="numInput" placeholder="Enter a positive integer">
        <button onclick="checkPrime()">Check Number</button>
        <div id="output"></div>
    </div>

    <script>
        function checkPrime() {
            let n = parseInt(document.getElementById("numInput").value);
            let outputDiv = document.getElementById("output");

            if (isNaN(n) || n <= 1) {
                outputDiv.innerHTML = "Please enter a number greater than 1.";
                return;
            }

            let isPrime = true;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) {
                    isPrime = false;
                    break;
                }
            }

            if (isPrime) {
                outputDiv.innerHTML = `${n} is a Prime Number.`;
                outputDiv.style.color = "green";
            } else {
                outputDiv.innerHTML = `${n} is a Composite Number.`;
                outputDiv.style.color = "orange";
            }
        }
    </script>
</body>
</html>
