<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q18 - Todo List App</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #eef2f5; }
        .box { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 70%; padding: 8px; box-sizing: border-box; }
        button { width: 27%; padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        ul { padding-left: 20px; margin-top: 20px; }
        li { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .del-btn { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Todo List Application</h2>
        <div>
            <input type="text" id="taskInput" placeholder="Enter new task...">
            <button onclick="addTask()">Add</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            let taskText = document.getElementById("taskInput").value.trim();
            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            let ul = document.getElementById("taskList");
            let li = document.createElement("li");
            li.innerHTML = `${taskText} <button class="del-btn" onclick="this.parentElement.remove()">Delete</button>`;
            
            ul.appendChild(li);
            document.getElementById("taskInput").value = "";
        }
    </script>
</body>
</html>
