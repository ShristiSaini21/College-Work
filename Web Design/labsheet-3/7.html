<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7 - Custom Object</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f9f9f9; }
        .box { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        #output { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Student Object with 'this'</h2>
        <button onclick="showStudentInfo()">Show Student Details</button>
        <div id="output"></div>
    </div>

    <script>
        let student = {
            name: "Aman Sharma",
            rollNo: 101,
            marks: [85, 90, 88],
            calcAverage: function() {
                let sum = this.marks.reduce((a, b) => a + b, 0);
                return (sum / this.marks.length).toFixed(2);
            },
            getDetails: function() {
                return `Name: ${this.name} <br>Roll No: ${this.rollNo} <br>Average Marks: ${this.calcAverage()}`;
            }
        };

        function showStudentInfo() {
            document.getElementById("output").innerHTML = student.getDetails();
        }
    </script>
</body>
</html>
