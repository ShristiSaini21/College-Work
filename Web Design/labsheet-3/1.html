<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q1 - Arithmetic Operations</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f4f4f9; text-align: center; }
        .box { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>JS Arithmetic Operations</h2>
        <p>Click the button to enter numbers via prompt.</p>
        <button onclick="runArithmetic()">Run Program</button>
    </div>

    <script>
        function runArithmetic() {
            let num1 = parseFloat(prompt("Enter first number:"));
            let num2 = parseFloat(prompt("Enter second number:"));

            if (isNaN(num1) || isNaN(num2)) {
                alert("Please enter valid numbers!");
                return;
            }

            let sum = num1 + num2;
            let diff = num1 - num2;
            let prod = num1 * num2;
            let div = num2 !== 0 ? (num1 / num2).toFixed(2) : "Cannot divide by zero";

            let resultText = `Sum: ${sum}\nDifference: ${diff}\nProduct: ${prod}\nDivision: ${div}`;
            
            console.log(resultText);
            alert(resultText);
        }
    </script>
</body>
</html>
