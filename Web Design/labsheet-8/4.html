<!DOCTYPE html>
<html>
<head>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f9f9f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--primary); line-height: 1.6; padding: 40px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="card">
        <h2>Modern Typography & Spacing</h2>
        <p>This design emphasizes clean whitespace and consistent color harmony.</p>
    </div>
</body>
</html>
